<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Save to Curioflow · 设置</title><link rel="stylesheet" href="styles.css"></head>
<body class="options"><div class="settings-card"><header><img src="icons/icon.png" width="36" height="36" alt=""><strong>Save to Curioflow</strong></header><main><h1>连接你的阅读空间</h1><p>设置 Curioflow 服务器地址，随时保存正在阅读的网页。</p><form id="settings-form"><label for="server">Server address</label><input id="server" name="server" type="url" placeholder="https://curioflow.example.com" required spellcheck="false" autocomplete="url"><p class="hint">支持 HTTPS、局域网 HTTP 和端口。请填写服务根地址。</p><button id="submit" type="submit">保存设置</button></form><p id="status" role="status"></p><button id="login" class="secondary" hidden>打开 Curioflow 登录 ↗</button><p class="hint">在此浏览器登录一次，扩展即可使用你的登录状态。之后回到文章页面，点击扩展图标即可保存。</p></main></div><script type="module" src="options.js"></script></body></html>
