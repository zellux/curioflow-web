<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save to Curioflow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <header class="brand">
    <img src="icons/icon.png" width="28" height="28" alt="">
    <strong>Save to Curioflow</strong>
    <button id="settings" class="text-button" aria-label="Server settings">Settings</button>
  </header>
  <main id="content" data-state="loading">
    <div class="feedback" role="status" aria-busy="true" id="feedback">
      <span id="symbol" class="symbol" aria-hidden="true"></span>
      <div class="feedback-copy">
        <h1 id="heading">Saving…</h1>
        <p id="message">Adding this page to your library.</p>
      </div>
      <div id="article" class="article" hidden>
        <p id="title" class="article-title"></p>
      </div>
    </div>
    <div class="actions">
      <button id="primary" hidden></button>
      <button id="retry" class="secondary" hidden>Try again</button>
    </div>
  </main>
  <footer id="server-label" hidden></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
