name: Verify self-hosted app

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - run: npm run test:state
      - run: npm run test:services
      - run: npm run test:ask:offline
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: curioflow_test
          POSTGRES_USER: curioflow_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U curioflow_test -d curioflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CURIOFLOW_TEST_DATABASE_URL: postgresql://curioflow_test:test-only@localhost:5432/curioflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate:prod
      - run: npm run test:services
      - run: npx next typegen
      - run: npm run typecheck
